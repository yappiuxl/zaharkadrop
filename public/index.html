<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Захарка Дроп</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a12;
    --bg2: #12121f;
    --panel: #181828;
    --border: #2a2a42;
    --text: #e8e8f0;
    --dim: #7a7a95;
    --accent: #00ffc8;
    --c-kaka: #6b6b6b;
    --c-norm: #4a9e5c;
    --c-rare: #3b82f6;
    --c-epic: #a855f7;
    --c-legend: #f59e0b;
    --c-true: #ff2d6f;
    --item-w: 140px;
  }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    height: 100dvh;
    gap: 12px;
    padding: 12px;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    gap: 12px;
  }
  header h1 {
    font-size: 20px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--c-true), var(--c-legend), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .balance {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(0,255,200,0.4);
    white-space: nowrap;
  }
  .balance span { color: var(--dim); font-size: 12px; font-weight: 400; margin-right: 6px; }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .reset-btn:active { border-color: var(--c-true); color: var(--c-true); }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg2);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--dim);
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--border); }

  main {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .roulette-wrap {
    position: relative;
    height: 160px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .roulette-wrap::before, .roulette-wrap::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 60px;
    z-index: 5;
    pointer-events: none;
  }
  .roulette-wrap::before { left: 0; background: linear-gradient(90deg, var(--bg2), transparent); }
  .roulette-wrap::after { right: 0; background: linear-gradient(-90deg, var(--bg2), transparent); }
  .marker {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent);
    transform: translateX(-50%);
    z-index: 10;
    box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
  }
  .marker::before, .marker::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
  }
  .marker::before { top: -1px; border-top-color: var(--accent); }
  .marker::after { bottom: -1px; border-bottom-color: var(--accent); }

  .track {
    display: flex;
    height: 100%;
    align-items: center;
    will-change: transform;
  }
  .item {
    flex-shrink: 0;
    width: var(--item-w);
    height: 130px;
    margin: 0 6px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.3));
    border: 2px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .item .icon { font-size: 42px; line-height: 1; font-weight: 700; }
  .item .name {
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    padding: 0 4px;
    line-height: 1.15;
    color: var(--dim);
    word-break: break-word;
  }
  .item::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: var(--rar);
  }
  .item.kaka   { --rar: var(--c-kaka); }
  .item.norm   { --rar: var(--c-norm); }
  .item.rare   { --rar: var(--c-rare); }
  .item.epic   { --rar: var(--c-epic); }
  .item.legend { --rar: var(--c-legend); }
  .item.true   { --rar: var(--c-true); }
  .item.kaka   { box-shadow: inset 0 -40px 60px -40px var(--c-kaka); }
  .item.norm   { box-shadow: inset 0 -40px 60px -40px var(--c-norm); }
  .item.rare   { box-shadow: inset 0 -40px 60px -40px var(--c-rare); }
  .item.epic   { box-shadow: inset 0 -40px 60px -40px var(--c-epic); }
  .item.legend { box-shadow: inset 0 -40px 60px -40px var(--c-legend); }
  .item.true   { box-shadow: inset 0 -40px 60px -40px var(--c-true), 0 0 20px rgba(255,45,111,0.3); }

  .view { display: none; flex: 1; min-height: 0; overflow: hidden; flex-direction: column; }
  .view.active { display: flex; }

  .cases {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
    align-content: start;
  }
  .case {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    transition: border-color 0.15s;
  }
  .case:active:not(.disabled) { transform: scale(0.98); border-color: var(--accent); }
  .case.disabled .case-open { opacity: 0.4; pointer-events: none; }
  .case-open { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; width: 100%; touch-action: manipulation; }
  .case .case-icon { font-size: 42px; }
  .case .case-name { font-size: 13px; font-weight: 600; text-align: center; }
  .case .case-price { font-size: 15px; font-weight: 700; color: var(--accent); }
  .case-info-btn {
    position: absolute; top: 6px; right: 6px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--bg2); border: 1px solid var(--border); color: var(--dim);
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2; touch-action: manipulation;
  }
  .case-info-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }
  .case-info-btn::after { content: 'i'; font-style: italic; }

  /* ===== РУЛЕТКА (вкладка) ===== */
  .roul-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
    align-content: start;
  }
  .roul-hint {
    font-size: 11px;
    color: var(--dim);
    padding: 2px 2px 6px;
    line-height: 1.4;
  }

  /* ===== UPGRADER ===== */
  .upgrader {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .upg-top {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .upg-slot {
    aspect-ratio: 1;
    max-width: 150px;
    width: 100%;
    margin: 0 auto;
    border-radius: 12px;
    background: var(--bg2);
    border: 2px dashed var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    touch-action: manipulation;
    transition: border-color 0.15s;
  }
  .upg-slot.filled {
    border-style: solid;
    border-color: var(--rar);
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.3));
    box-shadow: inset 0 -30px 50px -30px var(--rar);
  }
  .upg-slot.filled.kaka   { --rar: var(--c-kaka); }
  .upg-slot.filled.norm   { --rar: var(--c-norm); }
  .upg-slot.filled.rare   { --rar: var(--c-rare); }
  .upg-slot.filled.epic   { --rar: var(--c-epic); }
  .upg-slot.filled.legend { --rar: var(--c-legend); }
  .upg-slot.filled.true   { --rar: var(--c-true); }
  .upg-slot .slot-icon { font-size: 40px; font-weight: 700; line-height: 1; }
  .upg-slot .slot-name { font-size: 10px; text-align: center; color: var(--dim); padding: 0 4px; line-height: 1.1; }
  .upg-slot .slot-price { font-size: 11px; font-weight: 700; color: var(--accent); }
  .upg-slot .slot-empty { font-size: 36px; color: var(--border); }
  .upg-slot .slot-hint { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }

  .wheel-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wheel-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    transition: transform 0s;
  }
  .wheel-svg .seg-lose { fill: #ff2d6f; }
  .wheel-svg .seg-win  { fill: #22c55e; }
  .wheel-center {
    position: absolute;
    inset: 22%;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    z-index: 2;
  }
  .wheel-center .wc-chance {
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .wheel-center .wc-mult { font-size: 9px; color: var(--dim); font-weight: 600; }
  .wheel-pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 16px solid var(--text);
    z-index: 3;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
  }

  .upg-actions { display: flex; gap: 8px; }
  .upg-btn {
    flex: 1;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.1s;
  }
  .upg-btn:active:not(:disabled) { transform: scale(0.97); }
  .upg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .upg-btn.go {
    background: linear-gradient(90deg, var(--accent), #00b894);
    color: #000;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .upg-btn.clear { background: transparent; color: var(--dim); border: 1px solid var(--border); flex: 0 0 auto; padding: 14px 20px; }

  .upg-section-title {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    padding: 4px 2px;
  }
  .history { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .hist-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--bg2); border-radius: 8px;
    font-size: 11px; border-left: 3px solid var(--rar);
  }
  .hist-row.win  { --rar: #22c55e; }
  .hist-row.lose { --rar: #ff2d6f; }
  .hist-row .hist-icon { font-size: 16px; }
  .hist-row .hist-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-row .hist-chance { color: var(--dim); font-variant-numeric: tabular-nums; }
  .hist-row .hist-result { font-weight: 700; }
  .hist-row.win .hist-result { color: #22c55e; }
  .hist-row.lose .hist-result { color: #ff2d6f; }
  .hist-empty { color: var(--dim); font-size: 11px; text-align: center; padding: 12px; }

  aside {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .side-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .side-head h2 { font-size: 13px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .sell-all {
    font-size: 11px;
    padding: 6px 10px;
    background: transparent;
    border: 1px solid var(--c-norm);
    color: var(--c-norm);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  .sell-all:active { background: var(--c-norm); color: #fff; }
  .inventory {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .inv-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    background: var(--bg2);
    border-radius: 8px;
    border-left: 3px solid var(--rar);
    cursor: pointer;
    transition: background 0.15s;
    touch-action: manipulation;
  }
  .inv-item:active { background: #252540; }
  .inv-item.kaka   { --rar: var(--c-kaka); }
  .inv-item.norm   { --rar: var(--c-norm); }
  .inv-item.rare   { --rar: var(--c-rare); }
  .inv-item.epic   { --rar: var(--c-epic); }
  .inv-item.legend { --rar: var(--c-legend); }
  .inv-item.true   { --rar: var(--c-true); }
  .inv-item .inv-icon { font-size: 24px; flex-shrink: 0; font-weight: 700; min-width: 30px; text-align: center; }
  .inv-item .inv-info { flex: 1; min-width: 0; }
  .inv-item .inv-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inv-item .inv-rar { font-size: 9px; color: var(--rar); text-transform: uppercase; letter-spacing: 0.5px; }
  .inv-item .inv-price { font-size: 12px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 40px 10px; line-height: 1.5; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .win-card {
    background: var(--panel);
    border: 2px solid var(--rar, var(--accent));
    border-radius: 16px;
    padding: 26px 30px;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 60px -10px var(--rar, var(--accent));
    max-width: 340px;
    width: 100%;
  }
  .win-card .win-icon { font-size: 64px; margin-bottom: 8px; font-weight: 700; }
  .win-card .win-rar { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--rar, var(--accent)); margin-bottom: 6px; }
  .win-card .win-name { font-size: 22px; font-weight: 800; margin-bottom: 16px; word-break: break-word; }
  .win-card .win-price { font-size: 15px; color: var(--accent); font-weight: 700; margin-bottom: 20px; }
  .win-card button {
    padding: 12px 40px;
    font-size: 15px;
    font-weight: 700;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    touch-action: manipulation;
  }
  .win-card button:active { transform: scale(0.97); }

  .info-card {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    max-width: 460px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .info-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  .info-title { font-size: 18px; font-weight: 800; }
  .info-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .info-close {
    background: var(--bg2); border: 1px solid var(--border); color: var(--dim);
    width: 32px; height: 32px; border-radius: 8px; font-size: 18px;
    cursor: pointer; flex-shrink: 0; touch-action: manipulation;
  }
  .info-close:active { background: var(--c-true); color: #fff; border-color: var(--c-true); }
  .info-me {
    font-size: 12px; color: var(--dim); margin-bottom: 14px;
    padding: 8px 10px; background: var(--bg2); border-radius: 8px;
    border-left: 3px solid var(--accent);
  }
  .info-me b { color: var(--accent); }
  .info-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
  .info-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; background: var(--bg2); border-radius: 8px;
    border-left: 3px solid var(--rar);
  }
  .info-row.kaka { --rar: var(--c-kaka); }
  .info-row.norm { --rar: var(--c-norm); }
  .info-row.rare { --rar: var(--c-rare); }
  .info-row.epic { --rar: var(--c-epic); }
  .info-row.legend { --rar: var(--c-legend); }
  .info-row.true { --rar: var(--c-true); }
  .info-row .ir-icon { font-size: 22px; font-weight: 700; min-width: 28px; text-align: center; }
  .info-row .ir-name { flex: 1; font-size: 13px; font-weight: 600; }
  .info-row .ir-price { font-size: 12px; color: var(--accent); font-weight: 700; margin-right: 8px; }
  .info-row .ir-chance { font-size: 12px; font-weight: 700; color: var(--dim); min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }

  .picker-list { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
  .picker-section {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--dim);
    padding: 8px 2px 2px;
  }
  .picker-section:first-child { padding-top: 0; }

  @keyframes popIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 768px) {
    :root { --item-w: 110px; }
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 180px; gap: 8px; padding: 8px; }
    header { padding: 8px 14px; gap: 8px; }
    header h1 { font-size: 16px; letter-spacing: 1px; }
    .balance { font-size: 15px; }
    .balance span { font-size: 10px; }
    .reset-btn { font-size: 10px; padding: 5px 8px; }

    .roulette-wrap { height: 120px; }
    .item { height: 100px; margin: 0 4px; }
    .item .icon { font-size: 32px; }
    .item .name { font-size: 9px; }

    .cases, .roul-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .case { padding: 10px 6px; gap: 6px; }
    .case .case-icon { font-size: 32px; }
    .case .case-name { font-size: 12px; }
    .case .case-price { font-size: 13px; }

    aside { max-height: none; }
    .side-head { padding: 8px 12px; }
    .inv-item { padding: 7px; }

    .upg-top { padding: 12px 8px; gap: 8px; }
    .wheel-wrap { width: 110px; height: 110px; }
    .wheel-center .wc-chance { font-size: 15px; }
    .wheel-center .wc-mult { font-size: 8px; }
    .upg-slot { max-width: 110px; }
    .upg-slot .slot-icon { font-size: 32px; }
  }

  @media (max-width: 400px) {
    :root { --item-w: 96px; }
    header h1 { font-size: 14px; }
    .balance { font-size: 13px; }
    .roulette-wrap { height: 104px; }
    .item { height: 88px; }
    .item .icon { font-size: 28px; }
    .case .case-icon { font-size: 28px; }
    .wheel-wrap { width: 92px; height: 92px; }
    .wheel-center .wc-chance { font-size: 13px; }
    .upg-slot { max-width: 88px; }
    .upg-slot .slot-icon { font-size: 26px; }
    .upg-top { gap: 4px; padding: 8px 4px; }
  }

  @media (max-height: 700px) {
    .roulette-wrap { height: 110px; }
    .item { height: 92px; }
    .item .icon { font-size: 30px; }
  }
  @media (max-height: 560px) {
    header { padding: 6px 12px; }
    header h1 { font-size: 14px; }
    .roulette-wrap { height: 90px; }
    .item { height: 78px; }
    .item .icon { font-size: 24px; }
    .item .name { font-size: 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Захарка Дроп</h1>
    <div class="header-right">
      <div class="balance"><span>Баланс</span><b id="balance">1000</b> ₽</div>
      <button class="reset-btn" id="resetBtn">Сброс</button>
    </div>
  </header>

  <div class="roulette-wrap">
    <div class="marker"></div>
    <div class="track" id="track"></div>
  </div>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="cases">Кейсы</button>
      <button class="tab" data-tab="roulette">Рулетка</button>
      <button class="tab" data-tab="upgrader">Апгрейдер</button>
    </div>

    <div class="view active" id="viewCases">
      <div class="cases" id="cases"></div>
    </div>

    <div class="view" id="viewRoulette">
      <div class="roul-hint">Выбери кейс — лента крутится, дроп падает в инвентарь. Шансы те же, что и в кейсах.</div>
      <div class="roul-grid" id="roulGrid"></div>
    </div>

    <div class="view" id="viewUpgrader">
      <div class="upgrader">
        <div class="upg-top">
          <div class="upg-slot" id="upgSourceSlot"></div>
          <div class="wheel-wrap">
            <div class="wheel-pointer"></div>
            <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 100 100"></svg>
            <div class="wheel-center">
              <div class="wc-chance" id="upgChanceValue">—</div>
              <div class="wc-mult" id="upgMult">x0</div>
            </div>
          </div>
          <div class="upg-slot" id="upgTargetSlot"></div>
        </div>

        <div class="upg-actions">
          <button class="upg-btn go" id="upgGo" disabled>Апгрейд</button>
          <button class="upg-btn clear" id="upgClear">Сброс</button>
        </div>

        <div class="upg-section-title">История</div>
        <div class="history" id="upgHistory"></div>
      </div>
    </div>
  </main>

  <aside>
    <div class="side-head">
      <h2>Инвентарь</h2>
      <button class="sell-all" id="sellAll">Продать всё</button>
    </div>
    <div class="inventory" id="inventory"></div>
  </aside>
</div>

<div class="overlay" id="overlay">
  <div class="win-card" id="winCard">
    <div class="win-icon" id="winIcon"></div>
    <div class="win-rar" id="winRar"></div>
    <div class="win-name" id="winName"></div>
    <div class="win-price" id="winPrice"></div>
    <button id="winClose">Забрать</button>
  </div>
</div>

<div class="overlay" id="infoOverlay">
  <div class="info-card">
    <div class="info-head">
      <div>
        <div class="info-title" id="infoTitle"></div>
        <div class="info-sub" id="infoSub"></div>
      </div>
      <button class="info-close" id="infoClose">✕</button>
    </div>
    <div class="info-me" id="infoME"></div>
    <div class="info-list" id="infoList"></div>
  </div>
</div>

<div class="overlay" id="pickerOverlay">
  <div class="info-card">
    <div class="info-head">
      <div>
        <div class="info-title">Выбери ставку</div>
        <div class="info-sub">Предмет из инвентаря</div>
      </div>
      <button class="info-close" id="pickerClose">✕</button>
    </div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<div class="overlay" id="targetPickerOverlay">
  <div class="info-card">
    <div class="info-head">
      <div>
        <div class="info-title">Выбери цель</div>
        <div class="info-sub" id="targetPickerSub">Предметы дороже ставки</div>
      </div>
      <button class="info-close" id="targetPickerClose">✕</button>
    </div>
    <div class="picker-list" id="targetPickerList"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'zaharka_drop_save_v5';
  const HOUSE_EDGE = 1.0;
  const MAX_HISTORY = 12;

  const RARITIES = {
    kaka:   { name: 'Кака',         color: '#6b6b6b' },
    norm:   { name: 'Норм',         color: '#4a9e5c' },
    rare:   { name: 'Редкий',       color: '#3b82f6' },
    epic:   { name: 'Эпический',    color: '#a855f7' },
    legend: { name: 'Легендарный',  color: '#f59e0b' },
    true:   { name: 'true Zaharka', color: '#ff2d6f' }
  };
  const RARITY_ORDER = ['kaka', 'norm', 'rare', 'epic', 'legend', 'true'];

  const ITEMS = {
    kaka: [
      { icon: '?',   name: 'Зевок',                price: 1   },
      { icon: '❌',  name: 'Упущенная возможность', price: 10  },
      { icon: '?',   name: 'Ошибка',               price: 50  },
      { icon: '!?',  name: 'Неточность',           price: 100 }
    ],
    norm: [
      { icon: '➡️', name: 'Вынужденный',           price: 500  },
      { icon: '📖', name: 'Теоретический',         price: 1000 }
    ],
    rare: [
      { icon: '👍', name: 'Хороший',               price: 2000 },
      { icon: '✔️', name: 'Отличный',              price: 3000 }
    ],
    epic: [
      { icon: '⭐️', name: 'Лучший',                price: 5000 }
    ],
    legend: [
      { icon: '!',  name: 'Замечательный',         price: 10000 }
    ],
    true: [
      { icon: '!!', name: 'БРИЛЛИАНТ',             price: 25000 }
    ]
  };

  const AVG = {};
  RARITY_ORDER.forEach(r => {
    const arr = ITEMS[r];
    AVG[r] = arr.reduce((s, i) => s + i.price, 0) / arr.length;
  });

  const BASE_SHAPE = { kaka: 40, norm: 35, rare: 18 };
  const TAIL = ['epic', 'legend', 'true'];

  function computeWeights(targetPrice) {
    const solve = (k) => {
      const w = {};
      for (const r in BASE_SHAPE) w[r] = BASE_SHAPE[r];
      for (const r of TAIL) w[r] = k;
      const total = Object.values(w).reduce((a, b) => a + b, 0);
      let ev = 0;
      for (const r in w) ev += (w[r] / total) * AVG[r];
      return ev;
    };
    let lo = 1e-9, hi = 1e9;
    for (let i = 0; i < 200; i++) {
      const mid = Math.sqrt(lo * hi);
      if (solve(mid) < targetPrice) lo = mid; else hi = mid;
    }
    const k = Math.sqrt(lo * hi);
    const w = {};
    for (const r in BASE_SHAPE) w[r] = BASE_SHAPE[r];
    for (const r of TAIL) w[r] = k;
    return w;
  }

  const CASES = [
    { id: 'starter', name: 'Стартовый',    icon: '📦', price: 100,   desc: 'Шанс на что-то норм' },
    { id: 'middle',  name: 'Средний',      icon: '🎁', price: 500,   desc: 'Больше шансов на редкое' },
    { id: 'pro',     name: 'Про',          icon: '🧰', price: 2000,  desc: 'Только серьёзные вещи' },
    { id: 'zaharka', name: 'Захарка-кейс', icon: '👁️', price: 10000, desc: 'Шанс на БРИЛЛИАНТ' }
  ];
  CASES.forEach(c => {
    c.weights = computeWeights(c.price);
    c.actualME = RARITY_ORDER.reduce((s, r) => {
      const total = Object.values(c.weights).reduce((a, b) => a + b, 0);
      return s + (c.weights[r] / total) * AVG[r];
    }, 0);
  });

  const state = {
    balance: 1000,
    inventory: [],
    rolling: false,
    upgSource: null,
    upgTarget: null,
    upgRolling: false,
    history: []
  };

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        balance: state.balance,
        inventory: state.inventory.map(i => ({ icon: i.icon, name: i.name, price: i.price, rarity: i.rarity, uid: i.uid })),
        history: state.history
      }));
    } catch (e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (typeof data.balance === 'number') state.balance = data.balance;
      if (Array.isArray(data.inventory)) state.inventory = data.inventory;
      if (Array.isArray(data.history)) state.history = data.history;
      return true;
    } catch (e) { return false; }
  }

  function resetSave() {
    if (!confirm('Сбросить весь прогресс? Баланс вернётся к 1000 ₽, инвентарь и история очистятся.')) return;
    state.balance = 1000;
    state.inventory = [];
    state.upgSource = null;
    state.upgTarget = null;
    state.history = [];
    save();
    updateBalance();
    renderInventory();
    updateCaseStates();
    renderUpgrader();
    renderRouletteGrid();
  }

  const $ = id => document.getElementById(id);
  const elTrack = $('track');
  const elBalance = $('balance');
  const elCases = $('cases');
  const elRoulGrid = $('roulGrid');
  const elInv = $('inventory');
  const elOverlay = $('overlay');
  const elWinCard = $('winCard');
  const elWinIcon = $('winIcon');
  const elWinRar = $('winRar');
  const elWinName = $('winName');
  const elWinPrice = $('winPrice');
  const elInfoOverlay = $('infoOverlay');
  const elInfoTitle = $('infoTitle');
  const elInfoSub = $('infoSub');
  const elInfoME = $('infoME');
  const elInfoList = $('infoList');
  const elPickerOverlay = $('pickerOverlay');
  const elPickerList = $('pickerList');
  const elTargetPickerOverlay = $('targetPickerOverlay');
  const elTargetPickerList = $('targetPickerList');
  const elTargetPickerSub = $('targetPickerSub');
  const elWheelSvg = $('wheelSvg');

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const fmt = n => n.toLocaleString('ru-RU');

  function rollRarity(weights) {
    const total = Object.values(weights).reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (const [rar, w] of Object.entries(weights)) {
      r -= w;
      if (r <= 0) return rar;
    }
    return Object.keys(weights)[0];
  }

  function makeItem(rarity) {
    const base = pick(ITEMS[rarity]);
    return { ...base, rarity, uid: Date.now() + Math.random() };
  }

  function updateBalance() { elBalance.textContent = fmt(state.balance); }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view' + name[0].toUpperCase() + name.slice(1)));
  }
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  function renderCases() {
    elCases.innerHTML = '';
    CASES.forEach(c => {
      const div = document.createElement('div');
      div.className = 'case';
      div.dataset.id = c.id;
      div.innerHTML = `
        <button class="case-info-btn" data-info="${c.id}"></button>
        <div class="case-open" data-open="${c.id}">
          <div class="case-icon">${c.icon}</div>
          <div class="case-name">${c.name}</div>
          <div class="case-price">${fmt(c.price)} ₽</div>
        </div>
      `;
      elCases.appendChild(div);
    });
    elCases.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', () => {
        const c = CASES.find(x => x.id === el.dataset.open);
        if (c) openCase(c);
      });
    });
    elCases.querySelectorAll('[data-info]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const c = CASES.find(x => x.id === el.dataset.info);
        if (c) showCaseInfo(c);
      });
    });
  }

  function updateCaseStates() {
    document.querySelectorAll('#viewCases .case').forEach(el => {
      const c = CASES.find(x => x.id === el.dataset.id);
      el.classList.toggle('disabled', state.balance < c.price || state.rolling);
    });
    document.querySelectorAll('#roulGrid .case').forEach(el => {
      const c = CASES.find(x => x.id === el.dataset.id);
      el.classList.toggle('disabled', state.balance < c.price || state.rolling);
    });
  }

  // ===== РУЛЕТКА (вкладка) =====
  function renderRouletteGrid() {
    elRoulGrid.innerHTML = '';
    CASES.forEach(c => {
      const div = document.createElement('div');
      div.className = 'case';
      div.dataset.id = c.id;
      div.innerHTML = `
        <div class="case-open" data-spin="${c.id}">
          <div class="case-icon">${c.icon}</div>
          <div class="case-name">${c.name}</div>
          <div class="case-price">${fmt(c.price)} ₽</div>
        </div>
      `;
      elRoulGrid.appendChild(div);
    });
    elRoulGrid.querySelectorAll('[data-spin]').forEach(el => {
      el.addEventListener('click', () => {
        const c = CASES.find(x => x.id === el.dataset.spin);
        if (c) spinRoulette(c);
      });
    });
    updateCaseStates();
  }

  function spinRoulette(caseObj) {
    if (state.rolling) return;
    if (state.balance < caseObj.price) return;
    switchTab('cases'); // лента наверху видна всегда, но переключим на кейсы, чтобы полоса была на виду
    openCase(caseObj);
  }

  function renderInventory() {
    elInv.innerHTML = '';
    if (state.inventory.length === 0) {
      elInv.innerHTML = '<div class="empty">Пусто.<br>Открывай кейсы, Максим.</div>';
      return;
    }
    [...state.inventory].reverse().forEach(item => {
      const div = document.createElement('div');
      div.className = 'inv-item ' + item.rarity;
      div.innerHTML = `
        <div class="inv-icon">${item.icon}</div>
        <div class="inv-info">
          <div class="inv-name">${item.name}</div>
          <div class="inv-rar">${RARITIES[item.rarity].name}</div>
        </div>
        <div class="inv-price">${fmt(item.price)} ₽</div>
      `;
      div.addEventListener('click', () => sellItem(item.uid));
      elInv.appendChild(div);
    });
  }

  function renderTrack(items) {
    elTrack.innerHTML = '';
    items.forEach(it => {
      const div = document.createElement('div');
      div.className = 'item ' + it.rarity;
      div.innerHTML = `<div class="icon">${it.icon}</div><div class="name">${it.name}</div>`;
      elTrack.appendChild(div);
    });
  }

  const WIN_INDEX = 50;
  const TRACK_LEN = 60;

  function getStepWidth() {
    const first = elTrack.children[0];
    if (!first) return 140;
    const rect = first.getBoundingClientRect();
    const st = getComputedStyle(first);
    const ml = parseFloat(st.marginLeft) || 0;
    const mr = parseFloat(st.marginRight) || 0;
    return rect.width + ml + mr;
  }

  function buildRoulette(finalItem, weights) {
    const items = [];
    for (let i = 0; i < TRACK_LEN; i++) {
      if (i === WIN_INDEX) items.push(finalItem);
      else items.push(makeItem(rollRarity(weights)));
    }
    renderTrack(items);
  }

  function animateRoll(finalItem, weights, onDone) {
    buildRoulette(finalItem, weights);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const wrapW = elTrack.parentElement.clientWidth;
        let step = getStepWidth();
        if (!step || step <= 0) step = 140;
        const winLeft = WIN_INDEX * step;
        const jitter = rand(-step * 0.15, step * 0.15);
        const finalX = -(winLeft + step / 2 - wrapW / 2) + jitter;

        elTrack.style.transition = 'none';
        elTrack.style.transform = 'translateX(0px)';
        void elTrack.offsetWidth;

        const duration = rand(3800, 4600);
        elTrack.style.transition = `transform ${duration}ms cubic-bezier(0.12, 0.8, 0.2, 1)`;
        elTrack.style.transform = `translateX(${finalX}px)`;

        setTimeout(onDone, duration + 100);
      });
    });
  }

  function openCase(caseObj) {
    if (state.rolling) return;
    if (state.balance < caseObj.price) return;

    state.rolling = true;
    state.balance -= caseObj.price;
    updateBalance();
    updateCaseStates();
    save();

    const rarity = rollRarity(caseObj.weights);
    const wonItem = makeItem(rarity);

    animateRoll(wonItem, caseObj.weights, () => {
      state.inventory.push(wonItem);
      state.rolling = false;
      updateBalance();
      updateCaseStates();
      renderInventory();
      save();
      showWin(wonItem);
    });
  }

  function showWin(item) {
    const rar = RARITIES[item.rarity];
    elWinCard.style.setProperty('--rar', rar.color);
    elWinIcon.textContent = item.icon;
    elWinRar.textContent = rar.name;
    elWinRar.style.color = rar.color;
    elWinName.textContent = item.name;
    elWinPrice.textContent = fmt(item.price) + ' ₽';
    elOverlay.classList.add('show');
  }

  function showCaseInfo(c) {
    elInfoTitle.textContent = c.icon + ' ' + c.name;
    elInfoSub.textContent = 'Цена: ' + fmt(c.price) + ' ₽';
    elInfoME.innerHTML = 'Матожидание кейса: <b>' + Math.round(c.actualME) + ' ₽</b> = цена';

    elInfoList.innerHTML = '';
    const total = Object.values(c.weights).reduce((a, b) => a + b, 0);

    RARITY_ORDER.forEach(rar => {
      const w = c.weights[rar] || 0;
      if (w <= 0) return;
      const pRar = w / total;

      const header = document.createElement('div');
      header.style.cssText = 'font-size:11px;letter-spacing:1px;text-transform:uppercase;color:' + RARITIES[rar].color + ';font-weight:700;margin:8px 2px 2px;';
      header.textContent = RARITIES[rar].name + ' — ' + (pRar * 100).toFixed(2) + '%';
      elInfoList.appendChild(header);

      ITEMS[rar].forEach(it => {
        const chance = pRar / ITEMS[rar].length;
        const row = document.createElement('div');
        row.className = 'info-row ' + rar;
        row.innerHTML = `
          <div class="ir-icon">${it.icon}</div>
          <div class="ir-name">${it.name}</div>
          <div class="ir-price">${fmt(it.price)} ₽</div>
          <div class="ir-chance">${(chance * 100).toFixed(2)}%</div>
        `;
        elInfoList.appendChild(row);
      });
    });

    elInfoOverlay.classList.add('show');
  }

  function sellItem(uid) {
    const idx = state.inventory.findIndex(i => i.uid === uid);
    if (idx === -1) return;
    state.balance += state.inventory[idx].price;
    state.inventory.splice(idx, 1);
    if (state.upgSource === uid) { state.upgSource = null; state.upgTarget = null; }
    updateBalance();
    updateCaseStates();
    renderInventory();
    renderUpgrader();
    save();
  }

  function sellAll() {
    if (state.inventory.length === 0) return;
    state.balance += state.inventory.reduce((s, i) => s + i.price, 0);
    state.inventory = [];
    state.upgSource = null;
    state.upgTarget = null;
    updateBalance();
    updateCaseStates();
    renderInventory();
    renderUpgrader();
    save();
  }

  // ===== UPGRADER =====
  function findItemByUid(uid) {
    return state.inventory.find(i => i.uid === uid) || null;
  }

  function getTargets(source) {
    if (!source) return [];
    const list = [];
    RARITY_ORDER.forEach(rar => {
      ITEMS[rar].forEach((it, index) => {
        if (it.price > source.price) {
          list.push({ rarity: rar, index, ...it });
        }
      });
    });
    list.sort((a, b) => a.price - b.price);
    return list;
  }

  function calcChance(source, target) {
    if (!source || !target) return null;
    const mult = target.price / source.price;
    let chance = (1 / mult) * HOUSE_EDGE;
    return Math.max(0.01, Math.min(0.99, chance));
  }

  // ===== КОЛЕСО =====
  const WHEEL_R = 48;
  const WHEEL_C = 50;

  function polarToXY(angleDeg, r) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: WHEEL_C + r * Math.cos(a), y: WHEEL_C + r * Math.sin(a) };
  }

  function arcPath(startDeg, endDeg, r) {
    const start = polarToXY(startDeg, r);
    const end = polarToXY(endDeg, r);
    const large = (endDeg - startDeg) > 180 ? 1 : 0;
    return `M ${WHEEL_C} ${WHEEL_C} L ${start.x} ${start.y} A ${r} ${r} 0 ${large} 1 ${end.x} ${end.y} Z`;
  }

  function renderWheel(chance) {
    elWheelSvg.innerHTML = '';
    const p = chance == null ? 0.5 : Math.max(0.001, Math.min(0.999, chance));
    const winDeg = p * 360;

    if (winDeg > 0.1) {
      const seg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      seg.setAttribute('d', arcPath(0, winDeg, WHEEL_R));
      seg.setAttribute('class', 'seg-win');
      elWheelSvg.appendChild(seg);
    }
    if (winDeg < 359.9) {
      const seg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      seg.setAttribute('d', arcPath(winDeg, 360, WHEEL_R));
      seg.setAttribute('class', 'seg-lose');
      elWheelSvg.appendChild(seg);
    }

    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    ring.setAttribute('cx', WHEEL_C);
    ring.setAttribute('cy', WHEEL_C);
    ring.setAttribute('r', WHEEL_R);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', 'rgba(0,0,0,0.4)');
    ring.setAttribute('stroke-width', '1');
    elWheelSvg.appendChild(ring);
  }

  function chanceColor(chance) {
    if (chance == null) return '#7a7a95';
    const p = Math.max(0, Math.min(1, chance));
    const hue = p * 130;
    return `hsl(${hue}, 85%, 55%)`;
  }

  function spinWheel(chance, isWin) {
    return new Promise(resolve => {
      const p = Math.max(0.001, Math.min(0.999, chance));
      const winDeg = p * 360;
      let targetAngle;
      if (isWin) {
        targetAngle = rand(0, winDeg * 0.98);
      } else {
        targetAngle = rand(winDeg + 0.02 * (360 - winDeg), 360);
      }
      const spins = 6 + Math.floor(Math.random() * 3);
      const finalRotation = -(targetAngle) - spins * 360;

      elWheelSvg.style.transition = 'none';
      elWheelSvg.style.transform = 'rotate(0deg)';
      void elWheelSvg.offsetWidth;

      const duration = 3200;
      elWheelSvg.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.9, 0.25, 1)`;
      elWheelSvg.style.transform = `rotate(${finalRotation}deg)`;

      setTimeout(() => {
        requestAnimationFrame(() => {
          elWheelSvg.style.transition = 'none';
          const norm = ((finalRotation % 360) + 360) % 360;
          elWheelSvg.style.transform = `rotate(${-norm}deg)`;
          requestAnimationFrame(() => resolve());
        });
      }, duration + 50);
    });
  }

  function setWheelInfo(chance) {
    const chVal = $('upgChanceValue');
    const chMult = $('upgMult');
    if (chance == null) {
      chVal.textContent = '—';
      chVal.style.color = 'var(--dim)';
      chMult.textContent = 'x0';
      return;
    }
    const color = chanceColor(chance);
    chVal.textContent = (chance * 100).toFixed(1) + '%';
    chVal.style.color = color;
    chMult.textContent = 'x' + (1 / chance).toFixed(2);
  }

  function renderUpgrader() {
    const source = findItemByUid(state.upgSource);
    const target = state.upgTarget;

    const srcEl = $('upgSourceSlot');
    srcEl.className = 'upg-slot';
    if (source) {
      srcEl.classList.add('filled', source.rarity);
      srcEl.innerHTML = `
        <div class="slot-icon">${source.icon}</div>
        <div class="slot-name">${source.name}</div>
        <div class="slot-price">${fmt(source.price)} ₽</div>
      `;
    } else {
      srcEl.innerHTML = `<div class="slot-empty">+</div><div class="slot-hint">Ставка</div>`;
    }
    srcEl.onclick = () => openPicker();

    const tgtEl = $('upgTargetSlot');
    tgtEl.className = 'upg-slot';
    if (target) {
      tgtEl.classList.add('filled', target.rarity);
      tgtEl.innerHTML = `
        <div class="slot-icon">${target.icon}</div>
        <div class="slot-name">${target.name}</div>
        <div class="slot-price">${fmt(target.price)} ₽</div>
      `;
      tgtEl.onclick = () => {
        if (state.upgRolling) return;
        state.upgTarget = null;
        renderUpgrader();
      };
    } else {
      tgtEl.innerHTML = `<div class="slot-empty">?</div><div class="slot-hint">Цель</div>`;
      tgtEl.onclick = () => {
        if (state.upgRolling) return;
        if (!source) { openPicker(); return; }
        openTargetPicker();
      };
    }

    const chance = calcChance(source, target);
    renderWheel(chance);
    setWheelInfo(chance);
    elWheelSvg.style.transition = 'none';
    elWheelSvg.style.transform = 'rotate(0deg)';

    $('upgGo').disabled = !(source && target) || state.upgRolling;

    renderHistory();
  }

  function renderHistory() {
    const el = $('upgHistory');
    if (state.history.length === 0) {
      el.innerHTML = '<div class="hist-empty">Пока пусто. Сделай первый апгрейд.</div>';
      return;
    }
    el.innerHTML = '';
    state.history.forEach(h => {
      const row = document.createElement('div');
      row.className = 'hist-row ' + (h.win ? 'win' : 'lose');
      row.innerHTML = `
        <div class="hist-icon">${h.win ? '✅' : '💀'}</div>
        <div class="hist-name">${h.fromIcon} ${h.fromName} → ${h.toIcon} ${h.toName}</div>
        <div class="hist-chance">${h.chance}%</div>
        <div class="hist-result">${h.win ? '+' + fmt(h.gain) + ' ₽' : '−' + fmt(h.loss) + ' ₽'}</div>
      `;
      el.appendChild(row);
    });
  }

  function openPicker() {
    elPickerList.innerHTML = '';
    if (state.inventory.length === 0) {
      elPickerList.innerHTML = '<div class="empty">Инвентарь пуст.<br>Открывай кейсы.</div>';
    } else {
      const maxPrice = Math.max(...RARITY_ORDER.flatMap(r => ITEMS[r].map(i => i.price)));
      const available = state.inventory.filter(i => i.price < maxPrice);
      if (available.length === 0) {
        elPickerList.innerHTML = '<div class="empty">Все предметы максимальной цены — апгрейдить некуда.</div>';
      } else {
        [...available].sort((a, b) => b.price - a.price).forEach(item => {
          const div = document.createElement('div');
          div.className = 'inv-item ' + item.rarity;
          div.innerHTML = `
            <div class="inv-icon">${item.icon}</div>
            <div class="inv-info">
              <div class="inv-name">${item.name}</div>
              <div class="inv-rar">${RARITIES[item.rarity].name}</div>
            </div>
            <div class="inv-price">${fmt(item.price)} ₽</div>
          `;
          div.addEventListener('click', () => {
            state.upgSource = item.uid;
            if (state.upgTarget && state.upgTarget.price <= item.price) {
              state.upgTarget = null;
            }
            elPickerOverlay.classList.remove('show');
            renderUpgrader();
          });
          elPickerList.appendChild(div);
        });
      }
    }
    elPickerOverlay.classList.add('show');
  }

  function openTargetPicker() {
    const source = findItemByUid(state.upgSource);
    if (!source) { openPicker(); return; }

    elTargetPickerSub.textContent = 'Дороже ставки: ' + source.icon + ' ' + source.name + ' (' + fmt(source.price) + ' ₽)';
    elTargetPickerList.innerHTML = '';

    const targets = getTargets(source);
    if (targets.length === 0) {
      elTargetPickerList.innerHTML = '<div class="empty">Нет целей дороже ставки.<br>Возьми предмет подешевле.</div>';
      elTargetPickerOverlay.classList.add('show');
      return;
    }

    const groups = {};
    targets.forEach(t => {
      if (!groups[t.rarity]) groups[t.rarity] = [];
      groups[t.rarity].push(t);
    });

    RARITY_ORDER.forEach(rar => {
      if (!groups[rar]) return;
      const sec = document.createElement('div');
      sec.className = 'picker-section';
      sec.style.color = RARITIES[rar].color;
      sec.textContent = RARITIES[rar].name;
      elTargetPickerList.appendChild(sec);

      groups[rar].forEach(t => {
        const ch = calcChance(source, t);
        const div = document.createElement('div');
        div.className = 'inv-item ' + t.rarity;
        div.innerHTML = `
          <div class="inv-icon">${t.icon}</div>
          <div class="inv-info">
            <div class="inv-name">${t.name}</div>
            <div class="inv-rar">${RARITIES[t.rarity].name}</div>
          </div>
          <div class="inv-price">${fmt(t.price)} ₽</div>
          <div class="t-chance" style="color:${chanceColor(ch)};font-size:11px;font-weight:700;margin-left:6px;">${(ch * 100).toFixed(1)}%</div>
        `;
        div.addEventListener('click', () => {
          if (state.upgRolling) return;
          state.upgTarget = t;
          elTargetPickerOverlay.classList.remove('show');
          renderUpgrader();
        });
        elTargetPickerList.appendChild(div);
      });
    });

    elTargetPickerOverlay.classList.add('show');
  }

  async function doUpgrade() {
    const source = findItemByUid(state.upgSource);
    const target = state.upgTarget;
    if (!source || !target || state.upgRolling) return;
    const chance = calcChance(source, target);
    if (chance == null) return;

    state.upgRolling = true;
    $('upgGo').disabled = true;

    const win = Math.random() < chance;

    await spinWheel(chance, win);

    const idx = state.inventory.findIndex(i => i.uid === source.uid);
    if (idx === -1) { state.upgRolling = false; renderUpgrader(); return; }
    state.inventory.splice(idx, 1);

    if (win) {
      const newItem = {
        icon: target.icon, name: target.name, price: target.price,
        rarity: target.rarity, uid: Date.now() + Math.random()
      };
      state.inventory.push(newItem);
      state.history.unshift({
        win: true, fromIcon: source.icon, fromName: source.name,
        toIcon: target.icon, toName: target.name,
        chance: (chance * 100).toFixed(1),
        gain: target.price, loss: 0
      });
      state.upgSource = null;
      state.upgTarget = null;
      save();
      renderInventory();
      state.upgRolling = false;
      renderUpgrader();
      showUpgradeResult(true, newItem, chance);
    } else {
      state.history.unshift({
        win: false, fromIcon: source.icon, fromName: source.name,
        toIcon: target.icon, toName: target.name,
        chance: (chance * 100).toFixed(1),
        gain: 0, loss: source.price
      });
      state.upgSource = null;
      state.upgTarget = null;
      save();
      renderInventory();
      state.upgRolling = false;
      renderUpgrader();
      showUpgradeResult(false, source, chance);
    }
    if (state.history.length > MAX_HISTORY) state.history.length = MAX_HISTORY;
    save();
  }

  function showUpgradeResult(success, item, chance) {
    const rar = RARITIES[item.rarity];
    elWinCard.style.setProperty('--rar', success ? rar.color : '#ff2d6f');
    elWinIcon.textContent = success ? '✅' : '💀';
    elWinRar.textContent = success ? 'АПГРЕЙД УДАЛСЯ' : 'ПРОВАЛ';
    elWinRar.style.color = success ? rar.color : '#ff2d6f';
    elWinName.textContent = success ? (item.icon + ' ' + item.name) : ('Потерян: ' + item.icon + ' ' + item.name);
    elWinPrice.textContent = 'Шанс был ' + (chance * 100).toFixed(1) + '%';
    elOverlay.classList.add('show');
  }

  $('winClose').addEventListener('click', () => elOverlay.classList.remove('show'));
  $('infoClose').addEventListener('click', () => elInfoOverlay.classList.remove('show'));
  elInfoOverlay.addEventListener('click', (e) => { if (e.target === elInfoOverlay) elInfoOverlay.classList.remove('show'); });
  $('pickerClose').addEventListener('click', () => elPickerOverlay.classList.remove('show'));
  elPickerOverlay.addEventListener('click', (e) => { if (e.target === elPickerOverlay) elPickerOverlay.classList.remove('show'); });
  $('targetPickerClose').addEventListener('click', () => elTargetPickerOverlay.classList.remove('show'));
  elTargetPickerOverlay.addEventListener('click', (e) => { if (e.target === elTargetPickerOverlay) elTargetPickerOverlay.classList.remove('show'); });
  $('sellAll').addEventListener('click', sellAll);
  $('resetBtn').addEventListener('click', resetSave);
  $('upgGo').addEventListener('click', doUpgrade);
  $('upgClear').addEventListener('click', () => {
    if (state.upgRolling) return;
    state.upgSource = null;
    state.upgTarget = null;
    renderUpgrader();
  });

  function init() {
    load();
    renderCases();
    renderRouletteGrid();
    renderInventory();
    renderUpgrader();
    updateBalance();
    updateCaseStates();
    renderTrack(Array.from({ length: 20 }, () => makeItem(rollRarity(CASES[0].weights))));
  }

  init();
})();
</script>
